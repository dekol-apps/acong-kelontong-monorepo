<div class="card-header mb-4">
  <div class="d-flex flex-row justify-content-between gap-4">
    <h3 class="card-title">Withdrawal History</h3>
    <a class="btn btn-primary" (click)="showForm('input')">New Withdrawal</a>
  </div>
</div>
<app-generic-table ngSkipHydration [columns]="columns" [data]="listWithdrawal" [usePagination]="true" [useSearch]="true"
  [total]="pagination.total" (OnDataRefresh)="getList($event)" [isLoading]="isLoading">
  <div appTableColumn customColumnId="action">
    <ng-template let-item>
      <div class="d-flex flex-row gap-1 justify-content-end">
        <a (click)="showForm('view')" class="text-white pointer btn btn-secondary">
          <i class="fa-solid fa-eye"></i>
        </a>
      </div>
    </ng-template>
  </div>
</app-generic-table>
