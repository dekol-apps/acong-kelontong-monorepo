<div class="card-body">
  <app-purchasing-detail [purchase_id]="purchase_id" (onQueryDetail)="detail=$event"></app-purchasing-detail>
</div>
<div class="card-footer d-flex gap-2">
  @if (type === 'view') {
  <button class="btn btn-primary" type="button" (click)="exit()">Exit</button>
  } @else {
  <button class="btn btn-secondary" type="button" (click)="clickBack()">Back</button>
  <button class="btn btn-primary" type="button" (click)="exit()">Save & Exit</button>
  }
  @if (detail?.status===PurchasingEn.CREATE) {
  <button class="btn btn-primary" type="button" (click)="clickSubmit()">Submit</button>
  }
</div>
