<div class="modal-header">
  <h4 class="modal-title" id="modal-title">
    <div class="card-title text-capitalize">{{ (type === 'edit' ? 'Edit' : type === 'view' ? 'View' : 'Create') | translate }} {{ 'Purchase Item' | translate }}</div>
  </h4>
  <button type="button" class="btn-close" aria-describedby="modal-title" (click)="onClose.emit()"></button>
</div>
<fieldset [disabled]="type==='view'">
  <form [formGroup]="form" appFormValidation (ngSubmit)="submit()">
    <div class="modal-body">
      <div class="d-flex flex-row flex-wrap justify-content-between gap-2">
        <div class="w-100">
          <label for="product" class="form-label">{{form.value.pruchase_order}}</label>
        </div>
        <div class="w-100">
          <label for="product" class="form-label required">{{ 'Product' | translate }}</label>
          <select class="form-select" id="product" formControlName="product">
            <option selected disabled value="">{{ 'Choose...' | translate }}</option>
            @for (product of products; track $index) {
            <option [value]="product._id">{{product.product_name}} ({{product.product_sku || '-'}})</option>
            }
          </select>
        </div>

        <div class="w-100">
          <label for="purchase_qty" class="form-label required">{{ 'Item Quantity' | translate }}</label>
          <input type="number" class="form-control" id="purchase_qty" formControlName="purchase_qty" />
        </div>

        <div class="w-100">
          <label for="purchase_price" class="form-label required">{{ 'Purchase Item Price' | translate }}</label>
          <input type="number" class="form-control" id="purchase_price" formControlName="purchase_price" step="0.01" />
        </div>

      </div>
    </div>
    @if (type!=='view') {
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="onClose.emit()">{{ 'COMMON_CANCEL' | translate }}</button>
      <button class="btn btn-primary" type="submit">{{ 'Submit' | translate }}</button>
    </div>
    }
  </form>
</fieldset>
