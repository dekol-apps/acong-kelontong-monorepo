@if (form) {
<form [formGroup]="form" appFormValidation (ngSubmit)="submit()">
  <div class="card-body">
    <fieldset [disabled]="type==='view'">
      <div class="d-flex flex-row flex-wrap justify-content-between gap-2">
        <div class="w-100">
          <label for="invoice_number" class="form-label" appAutoWildcard>Invoice Number</label>
          <input type="text" class="form-control" id="invoice_number" formControlName="invoice_number"
            placeholder="Enter id number from purchasing invoice" />
        </div>
        <div class="w-100">
          <label for="ppn_type" class="form-label" appAutoWildcard>PPn Type</label>
          <select class="form-select" id="ppn_type" formControlName="ppn_type">
            <option selected disabled value="">Choose...</option>
            @for (ppnType of ppnTypes; track $index) {
            <option [value]="ppnType.value">{{ppnType.label}}</option>
            }
          </select>
        </div>
        <div class="w-100">
          <label for="ppn_facture_number" class="form-label" appAutoWildcard>PPN Facture Number</label>
          <input type="text" class="form-control" id="ppn_facture_number" formControlName="ppn_facture_number"
            placeholder="Enter PPN facture number" />
        </div>
        <div class="w-100">
          <label for="ppn_rate" class="form-label" appAutoWildcard>PPn Rate (%)</label>
          <input type="number" class="form-control" id="ppn_rate" formControlName="ppn_rate"
            placeholder="Rate number in percent" />
        </div>
        <div class="w-100">
          <label for="ppn_amount" class="form-label" appAutoWildcard>PPn Amount (Rp)</label>
          <input type="number" class="form-control" id="ppn_amount" formControlName="ppn_amount"
            step="0.01"
            placeholder="Total PPn amount in rupiah" />
        </div>
        <div class="w-100">
          <label for="shipping_cost" class="form-label" appAutoWildcard>Shipping Cost (Rp)</label>
          <input type="number" class="form-control" id="shipping_cost" formControlName="shipping_cost"
            step="0.01"
            placeholder="Cost amount in rupiah" />
        </div>
        <div class="w-100">
          <label for="payment_realization" class="form-label required" appAutoWildcard>Payment Realization (Rp)</label>
          <input type="number" class="form-control" id="payment_realization" formControlName="payment_realization"
            step="0.01"
            placeholder="Total amount of money spent in rupiah" />
        </div>
        <div class="w-100">
          <label for="notes" class="form-label" appAutoWildcard>Description</label>
          <textarea class="form-control" id="notes" rows="3" formControlName="notes"></textarea>
        </div>
        <div class="w-100">
          <label for="invoice_photo" class="form-label" appAutoWildcard>Attachments</label>
          <app-drag-drop-file-multi [patchFileVal]="form.value.attachments" [loading]="isLoading"
            (fileChanged)="addFile($event)" message="Tambahkan Foto Sampul Kos"></app-drag-drop-file-multi>
        </div>
        @if (invalidPPn) {
        <div class="border border-danger rounded text-danger p-4 w-100" style="white-space: pre-wrap;"
          [innerHTML]="invalidPPn"></div>
        }
      </div>
    </fieldset>
  </div>
  <div class="card-footer d-flex gap-2">
    @if (purchasingDetail?.status === PurchasingEn.PROCESS) {
    <button class="btn btn-secondary" type="button" (click)="exit()">Exit</button>
    }
    <button class="btn btn-secondary" type="button" (click)="back.emit()">Back</button>
    <button class="btn btn-primary" type="submit">Submit</button>
  </div>
</form>
}
