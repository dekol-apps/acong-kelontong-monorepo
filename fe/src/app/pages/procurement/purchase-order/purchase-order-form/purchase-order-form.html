<div class="card">
  <div class="card-header">
    <div class="card-title text-capitalize">{{ 'Purchase Order' | translate }}</div>
  </div>
  <ul ngbNav #nav="ngbNav" [(activeId)]="activeStep" [destroyOnHide]="false" class="nav-tabs mt-4">
    <li [disabled]="true" [ngbNavItem]="1" [destroyOnHide]="true">
      <button ngbNavLink>{{ 'Supplier' | translate }}</button>
      <ng-template ngbNavContent>
        <div class="nav-tabs m-2">
          <app-purchase-order-form1 [form]="form" [type]="type" [purchase_id]="purchase_id" (back)="done()"
            (next)="submitForm1($event)"></app-purchase-order-form1>
        </div>
      </ng-template>
    </li>
    <li [disabled]="true" [ngbNavItem]="2" [destroyOnHide]="true">
      <button ngbNavLink>{{ 'Items' | translate }}</button>
      <ng-template ngbNavContent>
        <div class="nav-tabs m-2">
          <app-purchase-order-item [type]="type" [purchase_id]="purchase_id" (back)="prevStep()"
            (next)="nextStep()"></app-purchase-order-item>
        </div>
      </ng-template>
    </li>
    <li [disabled]="true" [ngbNavItem]="3" [destroyOnHide]="true">
      <button ngbNavLink>{{ 'Payment' | translate }}</button>
      <ng-template ngbNavContent>
        <div class="nav-tabs m-2">
          <app-purchase-order-form-payment [form]="form" [type]="type" [purchase_id]="purchase_id" (back)="prevStep()"
            (next)="submitFormPayment($event)"></app-purchase-order-form-payment>
        </div>
      </ng-template>
    </li>
  </ul>

  <div [ngbNavOutlet]="nav" class="mt-2"></div>
</div>
