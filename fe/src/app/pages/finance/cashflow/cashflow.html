<div class="cashflow-page">
  <!-- Header -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white border-0">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h3 class="card-title fw-bold mb-0">
            <i class="bi bi-arrow-left-right me-2 text-primary"></i>Cashflow History
          </h3>
          <p class="text-muted small mb-0 mt-1">Track all cash movements in and out</p>
        </div>
        <a routerLink="/finance-report" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-bar-chart-line me-1"></i>Finance Report
        </a>
      </div>
    </div>

    <!-- Tabs -->
    <div class="card-body pt-0">
      <ul class="nav nav-tabs cashflow-tabs" id="cashflowTabs">
        <li class="nav-item">
          <button
            id="tab-cash-in"
            class="nav-link d-flex align-items-center gap-2"
            [class.active]="activeTab === FlowType.IN"
            (click)="setTab(FlowType.IN)">
            <i class="bi bi-arrow-down-circle-fill text-success"></i>
            Cash In
          </button>
        </li>
        <li class="nav-item">
          <button
            id="tab-cash-out"
            class="nav-link d-flex align-items-center gap-2"
            [class.active]="activeTab === FlowType.OUT"
            (click)="setTab(FlowType.OUT)">
            <i class="bi bi-arrow-up-circle-fill text-danger"></i>
            Cash Out
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Table Card -->
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <app-generic-table
        ngSkipHydration
        [columns]="activeColumns"
        [data]="listAccounting"
        [usePagination]="true"
        [useSearch]="true"
        [total]="pagination.total"
        (OnDataRefresh)="getList($event)"
        [isLoading]="isLoading">

        <!-- order_type column -->
        <div appTableColumn customColumnId="order_type">
          <ng-template let-item>
            <span class="badge text-bg-{{ getOrderTypeBadge(item.order_type) }}">
              {{ item.order_type }}
            </span>
          </ng-template>
        </div>

        <!-- amount column -->
        <div appTableColumn customColumnId="amount">
          <ng-template let-item>
            <span [class]="activeTab === FlowType.IN ? 'text-success fw-semibold' : 'text-danger fw-semibold'">
              @if (activeTab === FlowType.IN) { + } @else { - }
              {{ getAmount(item) | currency:'IDR':'symbol':'1.0-0' }}
            </span>
          </ng-template>
        </div>

        <!-- action column -->
        <div appTableColumn customColumnId="action">
          <ng-template let-item>
            <div class="d-flex flex-row gap-1 justify-content-end">
              <a [routerLink]="['/cashflow', item._id]" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-eye"></i>
              </a>
            </div>
          </ng-template>
        </div>

      </app-generic-table>
    </div>
  </div>
</div>
