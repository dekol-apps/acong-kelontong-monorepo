<div class="card">
    <div class="card-header mb-4">
        <div class="d-flex flex-row gap-2 justify-content-between">
            <h3 class="card-title">Sale Stock (Grouped)</h3>
            <a class="btn btn-primary pointer" [routerLink]="['./form']">+ Stock</a>
        </div>
    </div>
    <div class="card-body">
        <app-generic-table ngSkipHydration [columns]="columns" [data]="listSaleStock" [usePagination]="true"
            [useSearch]="true" [total]="pagination.total" (OnDataRefresh)="getList($event)" [isLoading]="isLoading">
            <div appTableColumn customColumnId="action">
                <ng-template let-item>
                    <div class="d-flex flex-row gap-1 justify-content-end">
                        <a [routerLink]="['./data/', item.product]" class="text-white pointer btn btn-secondary">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                    </div>
                </ng-template>
            </div>
        </app-generic-table>
    </div>
</div>
