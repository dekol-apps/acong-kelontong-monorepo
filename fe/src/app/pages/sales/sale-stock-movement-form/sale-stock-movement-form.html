<form [formGroup]="form" (ngSubmit)="onSubmit()" appFormValidation>
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <h3 class="card-title mb-0 fw-bold text-primary">Add Sale Stock</h3>
      <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" (click)="addItem()">
        <i class="bi bi-plus-lg me-1"></i> Add Another Item
      </button>
    </div>
    <div class="card-body bg-light">
      <div formArrayName="items" class="row g-4">
        @for (item of items.controls; track $index; let i = $index) {
          <div class="col-12 col-xl-6">
            <div class="card h-100 border-0 shadow-sm position-relative overflow-hidden">
              <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                <span class="badge bg-primary-subtle text-primary rounded-pill px-3">Item #{{ i + 1 }}</span>
                <button type="button" class="btn btn-link text-danger p-0" (click)="removeItem(i)" 
                        [disabled]="items.length <= 1" title="Remove item">
                  <i class="bi bi-trash3-fill fs-5"></i>
                </button>
              </div>
              <div class="card-body" [formGroupName]="i">
                <div class="row g-3">
                  <!-- Product Selection -->
                  <div class="col-12">
                    <label [attr.for]="'productDropdown-' + i" class="form-label small fw-bold text-muted text-uppercase mb-1 required">Product</label>
                    <div ngbDropdown container="body" class="d-inline-block w-100">
                      <button type="button"
                        class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center bg-white border-light-subtle py-2"
                        [class.is-invalid]="items.at(i).get('product')?.invalid && items.at(i).get('product')?.touched"
                        id="productDropdown-{{i}}" ngbDropdownToggle>
                        <span class="text-truncate">
                          {{ items.at(i).get('product_name')?.value || 'Select a product...' }}
                        </span>
                      </button>
                      <div ngbDropdownMenu [attr.aria-labelledby]="'productDropdown-' + i" class="w-100 shadow border-0 mt-1">
                        <div class="px-3 py-2 border-bottom sticky-top bg-white">
                          <input type="text" class="form-control form-control-sm border-0 bg-light rounded-pill"
                            placeholder="Search product..." (input)="filterProducts($event)">
                        </div>
                        <div class="dropdown-items-scroll" style="max-height: 200px; overflow-y: auto;">
                          @for (product of filteredProducts; track product._id) {
                          <button type="button" ngbDropdownItem (click)="selectProduct(i, product)" class="py-2 px-3 border-bottom border-light-subtle small">
                            {{ product.product_name }}
                          </button>
                          }
                          @if (filteredProducts.length === 0) {
                          <div class="dropdown-item disabled py-3 text-center text-muted italic small">No products found</div>
                          }
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Quantity -->
                  <div class="col-md-6">
                    <label [attr.for]="'qty-' + i" class="form-label small fw-bold text-muted text-uppercase mb-1 required">Quantity</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-light-subtle"><i class="bi bi-box-seam"></i></span>
                      <input type="number" [attr.id]="'qty-' + i" class="form-control bg-white border-light-subtle" formControlName="item_qty" min="1" placeholder="0">
                    </div>
                  </div>

                  <!-- Discount -->
                  <div class="col-md-6">
                    <label [attr.for]="'discount-' + i" class="form-label small fw-bold text-muted text-uppercase mb-1">Discount (%)</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-light-subtle"><i class="bi bi-percent"></i></span>
                      <input type="number" [attr.id]="'discount-' + i" class="form-control bg-white border-light-subtle" formControlName="discount_percent" min="0" max="100" placeholder="0">
                    </div>
                  </div>

                  <!-- Original Price -->
                  <div class="col-md-6">
                    <label [attr.for]="'orig-price-' + i" class="form-label small fw-bold text-muted text-uppercase mb-1 required">Cost Price (Original)</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light border-light-subtle">Rp</span>
                      <input type="number" [attr.id]="'orig-price-' + i" class="form-control bg-white border-light-subtle" formControlName="original_price" min="0" placeholder="0">
                    </div>
                  </div>

                  <!-- Sale Price -->
                  <div class="col-md-6">
                    <label [attr.for]="'sale-price-' + i" class="form-label small fw-bold text-muted text-uppercase mb-1 required">Sale Price</label>
                    <div class="input-group">
                      <span class="input-group-text bg-primary-subtle border-primary-subtle text-primary">Rp</span>
                      <input type="number" [attr.id]="'sale-price-' + i" class="form-control bg-white border-primary-subtle" formControlName="sale_price" min="0" placeholder="0">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
    <div class="card-footer bg-white border-top py-3 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-light px-4 rounded-pill border-0" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm" [disabled]="form.invalid || isLoading">
        @if (isLoading) {
          <output class="spinner-border spinner-border-sm me-2" aria-hidden="true"></output> Processing...
        } @else {
          <i class="bi bi-check2-circle me-1"></i> Update Sale Stock
        }
      </button>
    </div>
  </div>
</form>
