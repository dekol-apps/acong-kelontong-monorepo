<div class="modal-header">
  <h4 class="modal-title" id="modal-title">
    <div class="card-title text-capitalize">{{ (type==='new' ? 'Create' : type==='edit' ? 'Edit' : 'View') | translate }} {{ 'User' | translate }}</div>
  </h4>
  <button type="button" class="btn-close" aria-describedby="modal-title" (click)="close.emit()"></button>
</div>
<fieldset [disabled]="type==='view'">
  <form [formGroup]="form" appFormValidation (ngSubmit)="submit()">
    <div class="modal-body">
      <div class="d-flex flex-row flex-wrap justify-content-between gap-2">
        <div class="w-100">
          <label for="first_name" class="form-label required">{{ 'First name' | translate }}</label>
          <input type="text" class="form-control" id="first_name" formControlName="first_name" />
        </div>

        <div class="w-100">
          <label for="last_name" class="form-label required">{{ 'Last name' | translate }}</label>
          <input type="text" class="form-control" id="last_name" formControlName="last_name" />
        </div>

        <div class="w-100">
          <label for="username" class="form-label required">{{ 'Username' | translate }}</label>
          <input type="text" class="form-control" id="username" formControlName="username" />
        </div>

        <div class="w-100">
          <label for="email" class="form-label required">{{ 'Email' | translate }}</label>
          <input type="email" class="form-control" id="email" formControlName="email" />
        </div>

        @if (type === 'new') {
        <div class="w-100">
          <div class="form-text mb-2">Initial password will be the same as the username.</div>
        </div>
        }

        @if (type === 'edit') {
        <div class="w-100">
          <label for="password" class="form-label">{{ 'Password' | translate }}</label>
          <input type="password" class="form-control" id="password" formControlName="password"
            placeholder="Leave blank to keep current password" />
        </div>
        }

        <div class="w-100">
          <label for="role" class="form-label required">{{ 'Role' | translate }}</label>
          <select class="form-select" id="role" formControlName="role">
            <option selected disabled value="">{{ 'Choose...' | translate }}</option>
            @for (role of roles; track $index) {
            <option [value]="role._id" [disabled]="!role.active">{{role.role_name}}</option>
            }
          </select>
        </div>
      </div>
    </div>
    @if (type!=='view') {
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="close.emit()">{{ 'COMMON_CANCEL' | translate }}</button>
      <button class="btn btn-primary" type="submit">{{ 'Submit' | translate }}</button>
    </div>
    }
  </form>
</fieldset>
