<app-generic-table ngSkipHydration [columns]="columns" [data]="listPurchasing" [filterSelect]="filterSelect"
  [usePagination]="true" [useSearch]="true" [total]="pagination.total" (OnDataRefresh)="getList($event)"
  [isLoading]="isLoading">
  <div appTableColumn customColumnId="action">
    <ng-template let-item>
      <div class="d-flex flex-row gap-1 justify-content-end">
        <a [routerLink]="['./form', item._id]" [queryParams]="{type: 'view'}"
          class="text-white pointer btn btn-secondary">
          <i class="fa-solid fa-eye"></i>
        </a>
        <a [routerLink]="['./form', item._id]" [queryParams]="{type: 'edit'}"
          class="text-white pointer btn btn-warning">
          <i class="fa-solid fa-pencil"></i>
        </a>
        <button (click)="deletePurchasing(item._id)" class="text-white pointer btn btn-danger"
          [disabled]="item.status !== 'REQUEST'">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </ng-template>
  </div>
</app-generic-table>
