<main class="login-page bg-body-secondary">
    <div class="position-absolute top-0 end-0 p-3">
        <app-language-toggle></app-language-toggle>
    </div>
    <div class="login-box">
        <div class="card card-outline card-primary">
            <div class="card-header">
                <a href="../index2.html"
                    class="link-dark text-center link-offset-2 link-opacity-100 link-opacity-50-hover">
                    <h1 class="mb-0"><b>Acong</b>Kelontong</h1>
                </a>
            </div>
            <div class="card-body login-card-body">
                <p class="login-box-msg">{{ 'layout.auth.signInMessage' | translate }}</p>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <div class="input-group mb-1">
                        <div class="form-floating">
                            <input id="loginUsername" type="text" class="form-control" formControlName="username"
                                placeholder="" />
                            <label for="loginUsername">Username</label>
                        </div>
                        <div class="input-group-text"><span class="bi bi-person-badge"></span></div>
                    </div>
                    <div class="input-group mb-1">
                        <div class="form-floating">
                            <input id="loginPassword" type="password" class="form-control" formControlName="password"
                                placeholder="" />
                            <label for="loginPassword">{{ 'layout.auth.password' | translate }}</label>
                        </div>
                        <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
                    </div>
                    <!--begin::Row-->
                    <div class="row">
                        <div class="col-8 d-inline-flex align-items-center">
                            <div class="form-check">
                                <!-- <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" /> -->
                                <!-- <label class="form-check-label" for="flexCheckDefault"> Remember Me </label> -->
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-4">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">{{ 'layout.auth.signIn' | translate }}</button>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!--end::Row-->
                </form>
                <!-- <div class="social-auth-links text-center mb-3 d-grid gap-2">
                    <p>- OR -</p>
                    <a href="#" class="btn btn-primary">
                        <i class="bi bi-facebook me-2"></i> Sign in using Facebook
                    </a>
                    <a href="#" class="btn btn-danger">
                        <i class="bi bi-google me-2"></i> Sign in using Google+
                    </a>
                </div> -->
                <!-- /.social-auth-links -->
                <p class="mb-1"><a href="forgot-password.html">{{ 'layout.auth.forgotPassword' | translate }}</a></p>
                <p class="mb-0">
                    <a [routerLink]="['/register']" class="text-center">{{ 'layout.auth.registerNewMembership' | translate }}</a>
                </p>
            </div>
            <!-- /.login-card-body -->
        </div>
    </div>
</main>
<app-alert></app-alert>
<app-page-spinner></app-page-spinner>
