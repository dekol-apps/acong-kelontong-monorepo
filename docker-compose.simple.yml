services:
  mongo:
    image: mongo:4.4
    container_name: acong-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "27017:27017"

  mongo-init:
    image: mongo:4.4
    container_name: acong-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      mongo --host mongo:27017 --eval '
      try {
        rs.status();
        print(\"Replica set already initialized\");
      } catch (e) {
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo:27017\" }
          ]
        });
      }'
      "

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: acong-be
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/AcongKelontongLocal?replicaSet=rs0&retryWrites=true&w=majority}
      PORT: ${BE_PORT:-3200}
      FE_DOMAIN: ${FE_DOMAIN:-https://ack.dekolapps.tech}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
    ports:
      - "${BE_PORT:-3200}:3200"
    volumes:
      - ./be/uploads:/app/uploads

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: acong-fe
    restart: unless-stopped
    depends_on:
      - be
    environment:
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${FE_PORT:-4200}:4000"

volumes:
  mongo_data:
