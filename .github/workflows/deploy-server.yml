name: Deploy To Laptop Server

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: "Deployment type"
        required: true
        default: "simple"
        type: choice
        options:
          - simple
          - regular

  push:
    # Any push to main/master triggers a real deployment on the server.
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            set -eu

            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH }}"
            REPO_URL="${{ vars.SERVER_REPO_URL }}"
            BRANCH="${{ github.ref_name }}"
            DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type || 'simple' }}"

            # Basic validation
            if [ -z "$DEPLOY_PATH" ]; then
              echo "SERVER_DEPLOY_PATH is required"
              exit 1
            fi

            if [ -z "${{ secrets.MONGO_URI }}" ]; then
              echo "MONGO_URI is required"
              exit 1
            fi

            # Clone or update repo
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              rm -rf "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --all --prune
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # Generate .env
            cat > .env <<EOF
            BE_PORT=${{ vars.BE_PORT }}
            FE_PORT=${{ vars.FE_PORT }}
            IS_PROD=true
            FE_DOMAIN=${{ vars.FE_DOMAIN }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            URL_CHANGE_PASSWORD=user-verification
            EOF

            # Deploy
            if [ "$DEPLOYMENT_TYPE" = "simple" ]; then
              echo "🚀 Deploying with SIMPLE setup..."
              docker-compose -f docker-compose.simple.yml down --remove-orphans || true
              docker-compose -f docker-compose.simple.yml up -d --build --remove-orphans
            else
              echo "🚀 Deploying with REGULAR setup..."
              docker-compose -f docker-compose.yml down --remove-orphans || true
              docker-compose -f docker-compose.yml up -d --build --remove-orphans
            fi

            # Cleanup unused images
            docker image prune -f

            # Optional: show running containers
            docker ps
