name: Deploy To Laptop Server

on:
  workflow_dispatch: # Manual trigger
    inputs:
      deployment_type:
        description: "Deployment type"
        required: true
        default: "simple"
        type: choice
        options:
          - simple
          - regular

  workflow_run:
    workflows: ["CI"] # Triggers after CI completes
    types:
      - completed
    branches:
      - main # Only for main branch
      - master # Only for master branch

# Concurrency control to prevent overlapping deployments
concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, x200-ghaction]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWERCASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy Application
        run: |
          set -euo pipefail

          DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type || 'simple' }}"
          REGISTRY_PREFIX="ghcr.io/${{ env.REPO_LOWERCASE }}"
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"

          # Basic validation
          if [ -z "${{ secrets.MONGO_URI }}" ]; then
            echo "MONGO_URI is required"
            exit 1
          fi

          # Log in to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Generate .env
          cat > .env <<EOF
          BE_PORT=${{ vars.BE_PORT }}
          FE_PORT=${{ vars.FE_PORT }}
          IS_PROD=true
          FE_DOMAIN=${{ vars.FE_DOMAIN }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SMTP_USER=${{ vars.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          URL_CHANGE_PASSWORD=user-verification
          EOF

          # Deploy using registry images
          if [ "$DEPLOYMENT_TYPE" = "simple" ]; then
            echo "Deploying with SIMPLE setup..."
            
            # Update docker-compose.simple.yml to use registry images
            sed -i 's|build:|image: '"${REGISTRY_PREFIX}"'/acong-be:'"${IMAGE_TAG}"'\n    # build:|' docker-compose.simple.yml
            sed -i '/fe:/,/container_name: acong-fe/{s|build:|image: '"${REGISTRY_PREFIX}"'/acong-fe:'"${IMAGE_TAG}"'\n    # build:|}' docker-compose.simple.yml
            
            # Deploy with updated images (preserves volumes)
            docker-compose -f docker-compose.simple.yml up -d --remove-orphans
          else
            echo "Deploying with REGULAR setup..."
            
            # Update docker-compose.yml to use registry images
            sed -i 's|build:|image: '"${REGISTRY_PREFIX}"'/acong-be:'"${IMAGE_TAG}"'\n    # build:|' docker-compose.yml
            sed -i '/fe:/,/container_name: acong-fe/{s|build:|image: '"${REGISTRY_PREFIX}"'/acong-fe:'"${IMAGE_TAG}"'\n    # build:|}' docker-compose.yml
            
            # Deploy with updated images (preserves volumes)
            docker-compose -f docker-compose.yml up -d --remove-orphans
          fi

          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30

          # Health checks
          BE_PORT=${{ vars.BE_PORT }}
          FE_PORT=${{ vars.FE_PORT }}
          
          echo "Checking backend health..."
          if curl -f http://localhost:${BE_PORT:-3200}/health || curl -f http://localhost:${BE_PORT:-3200}/; then
            echo "Backend is healthy"
          else
            echo "Backend health check failed"
            exit 1
          fi

          echo "Checking frontend health..."
          if curl -f http://localhost:${FE_PORT:-4200} || curl -f http://localhost:${FE_PORT:-4200}/; then
            echo "Frontend is healthy"
          else
            echo "Frontend health check failed"
            exit 1
          fi

          # Restore original docker-compose files
          git checkout -- docker-compose.simple.yml docker-compose.yml || true

          # Cleanup unused images (keep last 5 versions)
          docker image prune -f --filter "until=24h"

          # Show running containers
          docker ps
