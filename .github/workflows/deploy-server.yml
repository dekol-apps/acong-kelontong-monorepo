name: Deploy To Laptop Server

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'simple'
        type: choice
        options:
        - simple
        - regular
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            REPO_URL="${{ secrets.SERVER_REPO_URL }}"
            BRANCH="${{ github.ref_name }}"
            DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type || 'simple' }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "SERVER_DEPLOY_PATH is required"
              exit 1
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              rm -rf "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --all --prune
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # Create .env file for backend configuration
            cat > .env <<'EOF'
            NODE_ENV=production
            BE_PORT=${{ secrets.BE_PORT || '3200' }}
            FE_PORT=${{ secrets.FE_PORT || '4200' }}
            FE_API_URL=${{ secrets.FE_API_URL }}
            FE_ENCRYPTION_KEY=${{ secrets.FE_ENCRYPTION_KEY || '1234' }}
            FE_DOMAIN=${{ secrets.FE_DOMAIN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            EOF

            # Choose compose file based on deployment type
            if [ "$DEPLOYMENT_TYPE" = "simple" ]; then
              echo "🚀 Deploying with SIMPLE setup..."
              docker-compose -f docker-compose.simple.yml down --remove-orphans || true
              docker-compose -f docker-compose.simple.yml up -d --build --remove-orphans
            else
              echo "🚀 Deploying with REGULAR setup..."
              docker-compose -f docker-compose.yml down --remove-orphans || true
              docker-compose -f docker-compose.yml up -d --build --remove-orphans
            fi

            docker image prune -f
