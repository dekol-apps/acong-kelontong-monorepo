name: CI

on:
  pull_request:     # Runs when PR is opened/updated
  push:
    branches:
      - main        # Runs when pushed to main
      - master      # Runs when pushed to master
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (commit SHA). Leave empty to use current commit SHA."
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build Images
    runs-on: self-hosted
    # This forces all steps inside this job to use Bash on Windows 11 IoT
    defaults:
      run:
      # bash 0 to force using git bash
        shell: bash {0}
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-ci
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo_meta
        run: |
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Prepare Docker config for CI
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s\n' '{}' > "${DOCKER_CONFIG}/config.json"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend/frontend images
        env:
          REGISTRY_PREFIX: ghcr.io/${{ steps.repo_meta.outputs.repo_lowercase }}
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG_INPUT:-${GITHUB_SHA}}"

          cat > docker-compose.ci.images.yml <<EOF
          services:
            be:
              image: ${REGISTRY_PREFIX}/acong-be:${IMAGE_TAG}
            fe:
              image: ${REGISTRY_PREFIX}/acong-fe:${IMAGE_TAG}
          EOF

          docker compose -f docker-compose.yml -f docker-compose.ci.images.yml build be fe

          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.images.yml push be fe
          fi

  deploy:
    name: Deploy
    runs-on: self-hosted
    # This forces all steps inside this job to use Bash on Windows 11 IoT
    defaults:
      run:
        shell: bash {0}
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-ci
    needs: [docker-build]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    concurrency:
      group: deployment
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo_meta
        run: |
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve deployment variables
        id: deploy_vars
        run: |
          set -euo pipefail

          IMAGE_TAG_INPUT="${{ github.event.inputs.image_tag }}"

          if [ -z "${IMAGE_TAG_INPUT}" ]; then
            IMAGE_TAG_INPUT="${{ github.sha }}"
          fi

          echo "image_tag=${IMAGE_TAG_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker config for CI
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s\n' '{}' > "${DOCKER_CONFIG}/config.json"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy application
        env:
          REGISTRY_PREFIX: ghcr.io/${{ steps.repo_meta.outputs.repo_lowercase }}
          IMAGE_TAG: ${{ steps.deploy_vars.outputs.image_tag }}
          MONGO_URI_VALUE: mongodb://mongo:27017/AcongKelontongLocal?retryWrites=true&w=majority&replicaSet=rs0
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          BE_PORT_VALUE: ${{ vars.BE_PORT }}
          FE_PORT_VALUE: ${{ vars.FE_PORT }}
          FE_PUBLIC_URL_VALUE: ${{ vars.FE_DOMAIN }}
          BE_PUBLIC_URL_VALUE: ${{ vars.FE_API_URL }}
          SMTP_USER_VALUE: ${{ vars.SMTP_USER }}
          SMTP_PASS_VALUE: ${{ secrets.SMTP_PASS }}
          SMTP_HOST_VALUE: ${{ vars.SMTP_HOST }}
          SMTP_PORT_VALUE: ${{ vars.SMTP_PORT }}
        run: |
          set -euo pipefail

          echo "Runner host: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "Working directory: $(pwd)"

          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose (v2) is required on the self-hosted runner"
            exit 1
          fi

          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          : "${REGISTRY_PREFIX:?REGISTRY_PREFIX is required}"
          : "${JWT_SECRET_VALUE:?JWT_SECRET is required}"

          require_value() {
            local name="$1"
            local value="${!name:-}"

            if [ -z "${value}" ]; then
              echo "${name} is required"
              exit 1
            fi
          }

          require_value FE_PUBLIC_URL_VALUE
          require_value BE_PORT_VALUE
          require_value FE_PORT_VALUE
          require_value SMTP_USER_VALUE
          require_value SMTP_PASS_VALUE
          require_value SMTP_HOST_VALUE
          require_value SMTP_PORT_VALUE

          if ! [[ "${BE_PORT_VALUE}" =~ ^[0-9]+$ ]]; then
            echo "Invalid BE_PORT: ${BE_PORT_VALUE}. Must be numeric."
            exit 1
          fi

          if ! [[ "${FE_PORT_VALUE}" =~ ^[0-9]+$ ]]; then
            echo "Invalid FE_PORT: ${FE_PORT_VALUE}. Must be numeric."
            exit 1
          fi

          COMPOSE_FILE="docker-compose.yml"

          CURRENT_BE_IMAGE=$(docker inspect --format='{{.Config.Image}}' acong-be 2>/dev/null || true)
          CURRENT_FE_IMAGE=$(docker inspect --format='{{.Config.Image}}' acong-fe 2>/dev/null || true)

          echo "Current backend image: ${CURRENT_BE_IMAGE:-none}"
          echo "Current frontend image: ${CURRENT_FE_IMAGE:-none}"

          printf '%s\n' \
            "BE_PORT=${BE_PORT_VALUE}" \
            "FE_PORT=${FE_PORT_VALUE}" \
            'IS_PROD=true' \
            "FE_DOMAIN=${FE_PUBLIC_URL_VALUE}" \
            "MONGO_URI=${MONGO_URI_VALUE}" \
            "JWT_SECRET=${JWT_SECRET_VALUE}" \
            "SMTP_USER=${SMTP_USER_VALUE}" \
            "SMTP_PASS=${SMTP_PASS_VALUE}" \
            "SMTP_HOST=${SMTP_HOST_VALUE}" \
            "SMTP_PORT=${SMTP_PORT_VALUE}" \
            'URL_CHANGE_PASSWORD=user-verification' \
            > .env

          printf '%s\n' \
            'services:' \
            '  be:' \
            "    image: ${REGISTRY_PREFIX}/acong-be:${IMAGE_TAG}" \
            '    build: null' \
            '  fe:' \
            "    image: ${REGISTRY_PREFIX}/acong-fe:${IMAGE_TAG}" \
            '    build: null' \
            > docker-compose.ci.override.yml

          TARGET_BE_IMAGE="${REGISTRY_PREFIX}/acong-be:${IMAGE_TAG}"
          TARGET_FE_IMAGE="${REGISTRY_PREFIX}/acong-fe:${IMAGE_TAG}"

          echo "Backend image: ${TARGET_BE_IMAGE}"
          echo "Frontend image: ${TARGET_FE_IMAGE}"

          remove_acong_app_containers_in_context() {
            local ctx="$1"

            if ! docker context inspect "${ctx}" >/dev/null 2>&1; then
              return 0
            fi

            for cname in acong-be acong-fe; do
              if docker --context "${ctx}" inspect "${cname}" >/dev/null 2>&1; then
                echo "Removing existing ${cname} in context ${ctx} before deployment"
                docker --context "${ctx}" rm -f "${cname}" || true
              fi
            done
          }

          fail_if_port_still_in_use() {
            local port="$1"

            if command -v ss >/dev/null 2>&1 && ss -ltn "( sport = :${port} )" | tail -n +2 | grep -q .; then
              echo "Host port ${port} is still in use after removing acong-be/acong-fe."
              echo "This indicates another process/container is holding the port."
              for ctx in default desktop-linux; do
                if docker context inspect "${ctx}" >/dev/null 2>&1; then
                  echo "Context ${ctx} containers publishing ${port}:"
                  docker --context "${ctx}" ps --filter "publish=${port}" --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' || true
                fi
              done
              ss -ltnp "( sport = :${port} )" || true
              exit 1
            fi
          }

          remove_acong_app_containers_in_context default
          remove_acong_app_containers_in_context desktop-linux
          fail_if_port_still_in_use "${BE_PORT_VALUE}"
          fail_if_port_still_in_use "${FE_PORT_VALUE}"

          docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.override.yml pull be fe
          docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.override.yml up -d --remove-orphans --no-build
          docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.override.yml ps

          # Wait for nginx to start
          sleep 100

          # Verify ports are actually bound to containers before health checks
          for _ in $(seq 1 30); do
            if docker port acong-be 2>/dev/null | grep -q ":${BE_PORT_VALUE}$" && \
               docker port acong-fe 2>/dev/null | grep -q ":${FE_PORT_VALUE}$"; then
              echo "Ports are properly bound to containers"
              break
            fi
            echo "Waiting for ports to be bound to containers..."
            sleep 2
          done

          check_containers() {
            if [ "$(docker inspect --format='{{.State.Running}}' acong-be 2>/dev/null || echo false)" != "true" ]; then
              echo "Backend container is not running"
              return 1
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' acong-fe 2>/dev/null || echo false)" != "true" ]; then
              echo "Frontend container is not running"
              return 1
            fi

            if ! docker port acong-be 2>/dev/null | grep -q ":${BE_PORT_VALUE}$"; then
              echo "Backend container is not bound to expected host port ${BE_PORT_VALUE}"
              docker port acong-be || true
              return 1
            fi

            return 0
          }

          check_health() {
            local ok=0

            for _ in $(seq 1 24); do
              if check_containers \
                && (curl -fsS "http://localhost:${BE_PORT_VALUE}/api" >/dev/null || curl -fsS "http://localhost:${BE_PORT_VALUE}/health" >/dev/null || curl -fsS "http://localhost:${BE_PORT_VALUE}/" >/dev/null) \
                && curl -fsS "http://localhost:${FE_PORT_VALUE}/" >/dev/null; then

                if [ -n "${BE_PUBLIC_URL_VALUE:-}" ] && ! curl -fsS "${BE_PUBLIC_URL_VALUE}" >/dev/null; then
                  sleep 3
                  continue
                fi

                if [ -n "${FE_PUBLIC_URL_VALUE:-}" ] && ! curl -fsS "${FE_PUBLIC_URL_VALUE}" >/dev/null; then
                  sleep 3
                  continue
                fi

                ok=1
                break
              fi

              sleep 3
            done

            return $((1 - ok))
          }

          if check_health; then
            echo "Deployment health checks passed"
          else
            echo "Deployment health checks failed, starting rollback"
            docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.override.yml logs --tail=200 be || true
            docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.override.yml logs --tail=100 fe || true

            if [ -n "${CURRENT_BE_IMAGE}" ] && [ -n "${CURRENT_FE_IMAGE}" ]; then
              printf '%s\n' \
                'services:' \
                '  be:' \
                "    image: ${CURRENT_BE_IMAGE}" \
                '  fe:' \
                "    image: ${CURRENT_FE_IMAGE}" \
                > docker-compose.ci.rollback.yml

              docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.rollback.yml pull be fe
              docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.rollback.yml up -d --remove-orphans

              if check_health; then
                echo "Rollback successful"
              else
                echo "Rollback failed: services are still unhealthy"
                docker compose -f "${COMPOSE_FILE}" -f docker-compose.ci.rollback.yml logs --tail=200 be || true
                rm -f docker-compose.ci.rollback.yml
                rm -f docker-compose.ci.override.yml
                exit 1
              fi

              rm -f docker-compose.ci.rollback.yml
            else
              echo "Rollback skipped: previous container images not found"
              rm -f docker-compose.ci.override.yml
              exit 1
            fi
          fi

          rm -f docker-compose.ci.override.yml

          cleanup_repo_images() {
            local repository="$1"
            local keep_one="$2"
            local keep_two="$3"

            docker image ls "${repository}" --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
              [ -z "${img}" ] && continue
              [ "${img}" = "${repository}:<none>" ] && continue

              if [ "${img}" = "${keep_one}" ] || [ "${img}" = "${keep_two}" ]; then
                continue
              fi

              docker rmi "${img}" || true
            done
          }

          cleanup_repo_images "${REGISTRY_PREFIX}/acong-be" "${TARGET_BE_IMAGE}" "${CURRENT_BE_IMAGE}"
          cleanup_repo_images "${REGISTRY_PREFIX}/acong-fe" "${TARGET_FE_IMAGE}" "${CURRENT_FE_IMAGE}"

          echo "=== Running containers ==="
          docker ps
          echo "=== Images pulled ==="
          docker images | grep acong || true

      - name: Cleanup old GHCR backend images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        if: github.event_name == 'push'
        with:
          package-name: ${{ github.event.repository.name }}/acong-be
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
          token: ${{ github.token }}

      - name: Cleanup old GHCR frontend images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        if: github.event_name == 'push'
        with:
          package-name: ${{ github.event.repository.name }}/acong-fe
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
          token: ${{ github.token }}