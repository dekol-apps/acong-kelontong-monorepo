name: CI

on:
  pull_request:     # Runs when PR is opened/updated
  push:
    branches:
      - main        # Runs when pushed to main
      - master      # Runs when pushed to master

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Build
    runs-on: [self-hosted, x200-ghaction]
    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test --if-present

      - name: Build
        run: npm run build

  frontend:
    name: Frontend Build
    runs-on: [self-hosted, x200-ghaction]
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test --if-present

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build & Push
    runs-on: [self-hosted, x200-ghaction]
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWERCASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/acong-be:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWERCASE }}/acong-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/acong-fe:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWERCASE }}/acong-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test images
        run: |
          echo "Testing backend image..."
          docker run --rm ghcr.io/${{ env.REPO_LOWERCASE }}/acong-be:${{ github.sha }} npm --version
          echo "Testing frontend image..."
          docker run --rm ghcr.io/${{ env.REPO_LOWERCASE }}/acong-fe:${{ github.sha }} ng --version
