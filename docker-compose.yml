services:
  mongo1:
    image: mongo:7
    container_name: acong-mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:7
    container_name: acong-mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:7
    container_name: acong-mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: acong-mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      mongosh --host mongo1:27017 --eval '
      try {
        rs.status();
        print(\"Replica set already initialized\");
      } catch (e) {
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo1:27017\" },
            { _id: 1, host: \"mongo2:27017\" },
            { _id: 2, host: \"mongo3:27017\" }
          ]
        });
      }'
      "

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: acong-be
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/AcongKelontongLocal?replicaSet=rs0&retryWrites=true&w=majority}
      PORT: ${BE_PORT:-3200}
      FE_DOMAIN: ${FE_DOMAIN:-https://ack.dekolapps.tech}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
    ports:
      - "${BE_PORT:-3200}:3200"
    volumes:
      - ./be/uploads:/app/uploads

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        FE_API_URL: https://api.dekolapps.tech/api
        FE_ENCRYPTION_KEY: ${FE_ENCRYPTION_KEY:-1234}
    container_name: acong-fe
    restart: unless-stopped
    depends_on:
      - be
    environment:
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${FE_PORT:-4200}:4000"

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
