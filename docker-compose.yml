services:
  mongo1:
    image: mongo:4.4
    container_name: acong-mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:4.4
    container_name: acong-mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:4.4
    container_name: acong-mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:4.4
    container_name: acong-mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      mongosh --host mongo1:27017 --eval '
      try {
        rs.status();
        print(\"Replica set already initialized\");
      } catch (e) {
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo1:27017\" },
            { _id: 1, host: \"mongo2:27017\" },
            { _id: 2, host: \"mongo3:27017\" }
          ]
        });
      }'
      "

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: acong-be
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${BE_PORT:-3200}:3200"
    volumes:
      - ./be/uploads:/app/uploads

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: acong-fe
    restart: unless-stopped
    depends_on:
      - be
    ports:
      - "${FE_PORT:-4200}:4000"

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
