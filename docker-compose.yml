services:
  mongo:
    image: mongo:4.4
    container_name: acong-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "27017:27017"

  mongo-init:
    image: mongo:4.4
    container_name: acong-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -ec
      - |
        mongo --quiet --host mongo:27017 --eval '
        var initialized = false;

        try {
          var st = rs.status();
          initialized = st && st.ok === 1;
        } catch (e) {
          initialized = false;
        }

        if (!initialized) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo:27017" }
            ]
          });
          print("Replica set initiated");
        } else {
          print("Replica set already initialized");
        }
        '

        for _ in $(seq 1 30); do
          if [ "$(mongo --quiet --host mongo:27017 --eval 'db.isMaster().ismaster' | tr -d '\r\n')" = "true" ]; then
            echo "Replica set primary is ready"
            exit 0
          fi
          sleep 2
        done

        echo "Replica set primary readiness timeout"
        exit 1

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: acong-be
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${IS_PROD}
      MONGO_URI: ${MONGO_URI}
      BE_PORT: ${BE_PORT}
      FE_DOMAIN: ${FE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
    ports:
      - "${BE_PORT}:3200"
    volumes:
      - ./be/uploads:/app/uploads

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: acong-fe
    restart: unless-stopped
    depends_on:
      - be
    ports:
      - "${FE_PORT}:4200"

volumes:
  mongo_data:
